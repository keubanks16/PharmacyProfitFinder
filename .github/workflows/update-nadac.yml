name: Update NADAC prices

on:
  schedule:
    # Thursdays 10:17 AM Eastern (CMS posts new NADAC on Wednesdays)
    - cron: "17 15 * * 4"
  workflow_dispatch:
  push:
    paths:
      - scripts/update_nadac.py
      - .github/workflows/update-nadac.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download newest NADAC
        run: python scripts/update_nadac.py
      - name: Commit if changed
        run: |
          git config user.name "nadac-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/nadac.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update NADAC prices ($(date +%Y-%m-%d))"
            git push
          fi
